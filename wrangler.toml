name = "ianeo-orchestrator"
main = "src/index.ts"
compatibility_date = "2026-08-20"
workers_dev = true
keep_vars = true

[vars]
FAQ_SERVICE_URL = "https://faq.drthorne.uk"

[secrets]
required = [
  "TELEGRAM_BOT_TOKEN",
  "TELEGRAM_WEBHOOK_SECRET",
  "FAQ_SERVICE_TOKEN"
]

[durable_objects]
bindings = [
  { name = "MENU_CLEANUP", class_name = "MenuCleanup" }
]

[[migrations]]
tag = "v1-menu-cleanup"
new_sqlite_classes = ["MenuCleanup"]

[observability.logs]
enabled = true
head_sampling_rate = 1
